{{- /* The config-loader Consul token (write config/ only), from Key Vault. */ -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: consul-config-loader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "consul-config.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.store.name }}
    kind: {{ .Values.secrets.store.kind }}
  target:
    name: consul-config-loader
    creationPolicy: Owner
  data:
    - secretKey: CONSUL_HTTP_TOKEN
      remoteRef: { key: {{ .Values.secrets.configLoaderToken }} }
