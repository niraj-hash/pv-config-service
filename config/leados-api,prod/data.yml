# leados-api in production: only what differs from config/leados-api/data. Non-secret only.
#
# TODO(owner), before the cut-over from Container Apps: app.crm.system-actor-user-id must be the
# CRM_SYSTEM_ACTOR_USER_ID leados-backend-prod runs with today (generated by the retired
# infra/deploy-azure.sh; `az containerapp show -g rg-leados-prod -n leados-backend-prod --query
# "properties.template.containers[0].env[?name=='CRM_SYSTEM_ACTOR_USER_ID'].value" -o tsv`), so
# leads captured after the move carry the same actor as before. Until it is set here the service
# uses its application.yml default (the all-zero UUID).
app:
  ad-studio:
    storage:
      # The account the Container Apps deployment created (rg-leados-prod); the chart's workload
      # identity needs "Storage Blob Data Contributor" on it.
      account-endpoint: https://leadosadstudioprod.blob.core.windows.net
