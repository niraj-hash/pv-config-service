    health.daily-brief:
      description: A physician's daily appointment briefing (prompt held here)
      products: [hms]
      candidates: [anthropic:claude-sonnet-5-5, anthropic:claude-opus-5-5]
      prompt: health.daily-brief
      params: { max-output-tokens: 1500, reasoning: { effort: low } }
    health.scribe-transcribe:
      description: >-
        The AI scribe: a consultation recorded with the patient's consent, sent as pieces under 60 seconds
        (16 kHz WAV); text comes back, no audio is kept
      products: [hms]
      capability: transcription
      # Azure Speech in Central India, the platform's own cloud. No other speech company until the
      # owner approves one as a processor of patient audio (Health decision D12).
      candidates: [azure-speech:short-audio]
      params: { language: hi-IN }
      max-audio-bytes: 4194304
      timeout-ms: 30000
    health.scribe:
      description: A consultation note drafted from the scribe's transcript, for the doctor to review (prompt held here)
      products: [hms]
      candidates: [anthropic:claude-sonnet-5-5, anthropic:claude-opus-5-5]
      prompt: health.scribe
