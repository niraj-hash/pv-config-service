      candidates: [openai:gpt-4o-transcribe, deepgram:nova-3]
      timeout-ms: 60000
    interview.interviewer-voice:
      description: The AI interviewer's voice
      products: [interview]
      capability: speech
      candidates: [openai:gpt-4o-mini-tts]
      params:
        voice: interviewer
        instructions: Read the text exactly as written, clearly, at an even and moderate pace, in a neutral and calm tone.
      timeout-ms: 20000

    # ------------------------------------------------------------ Runvance Accelerator (runvance)
    accelerator.erp-query:
      description: Natural-language questions over ERP (Odoo) data
      products: [runvance]
      candidates: [openai:gpt-4o-mini, anthropic:claude-haiku-4-5]
      prompt: accelerator.erp-query
      params: { temperature: 0.2, max-output-tokens: 1200 }
      timeout-ms: 20000

    # ------------------------------------------------------------ Runvance Meet (meet)
    # Recorded meetings (consent recorded by Meet): one call per speaker's track, then the notes.
    meet.recording-transcription:
      description: >-
        One speaker's microphone from a recorded meeting (LiveKit track Egress: Ogg/Opus, mono, up to several hours),
        by source_url; phrases with offsets (no speakers: one person per file)
      products: [meet]
      capability: transcription
      # Azure Speech in Central India only: meeting audio never goes to a speech company or region
      # outside India (owner's decision D2, 2026-11-17). A second attempt on the same model is fine.
      candidates: [azure-speech:fast]
      # Language identification picks each file's main locale (each file is one person).
      params: { locales: [en-IN, hi-IN] }
      max-audio-bytes: 1073741824     # 1 GB: a speaker's Opus track is tens of MB an hour
      timeout-ms: 1800000             # one attempt: download, measure, cut, every piece
      deadline-ms: 3600000
      max-attempts: 2
    meet.notes:
      description: >-
        Notes from a recorded meeting's transcript: summary, decisions, action items, chapters, open questions and a
        follow-up email draft, each item citing its transcript lines (prompt held here)
      products: [meet]
      candidates: [anthropic:claude-sonnet-5-5, openai:gpt-5]
      prompt: meet.notes
      params: { cache-system-prompt: true, max-output-tokens: 12000, reasoning: { effort: medium } }
      timeout-ms: 180000
      deadline-ms: 400000
    # Live captions (ai-demo-agent meet/docs/product/phase3-live-ai.md): each person's browser captions their own microphone
    # with Azure Speech's SDK in Central India, from this short-lived token. Audio never leaves India and never passes
    # through Meet or ai-service (owner's decision D2).
    meet.live-captions:
      description: Azure Speech token for the browser SDK (a person's own live captions in a Meet call)
      products: [meet]
      capability: speech_token
      candidates: [azure-speech:browser]
      params: { language: en-IN }
    # The in-call assistant: "Catch me up" and questions about what was said, from the call's caption text (Meet sends the
    # system prompt). Text only, as with the notes; fast models, since someone is waiting in the call.
    meet.live-assist:
      description: In-call assistant answers (catch-up summaries, questions) from a live call's captions
      products: [meet]
      candidates: [google:gemini-2.5-flash, openai:gpt-5-mini]
      params: { temperature: 0.2, max-output-tokens: 1200, reasoning: { budget-tokens: 0, effort: minimal } }
      timeout-ms: 30000
      deadline-ms: 60000

  prompts:
    crm.lead-summary:
      active: 1
      versions:
        1:
          notes: From PayVizio-LeadOS LeadIntelligenceService.summarise (2026-11-09)
          system: >-
            You summarise CRM leads for salespeople. Be specific and brief. Never invent facts,
            budgets, timelines or names that are not in the data you were given. If the data is
            thin, say so plainly instead of padding.
          user: |
            Summarise this lead for a salesperson who is about to call them.

            Lead:
            {{lead}}

            Recent history (newest first):
            {{timeline}}

            Write two or three sentences for "summary" covering who they are and what they want.
            Put where things stand in "situation". List concrete buying signals in "signals" and
            anything worrying in "concerns". Use only what is in the data above -- if something is
            not there, leave the list empty rather than guessing.
          variables:
            lead: { untrusted: true }
            timeline: { untrusted: true }
          response-format:
            type: json_schema
            name: lead_summary
            schema:
              type: object
              properties:
                summary: { type: string }
                situation: { type: string }
                signals: { type: array, items: { type: string } }
                concerns: { type: array, items: { type: string } }
              required: [summary, situation]
    health.daily-brief:
      active: 1
      versions:
        1:
          notes: From hms DoctorAssistService.applyLlmBrief (2026-11-09)
          system: >-
            You are a clinical assistant preparing a physician's daily briefing from their
            appointment panel. Be concise, factual, and India-context. Do not invent patient data
            beyond what is provided. Output is a decision aid; the physician makes final calls.
          user: |
            Today's appointment panel:
            {{panel}}
          variables:
            panel: { untrusted: true, description: "one line per appointment: id, age, visit, diagnosis, medications, allergies" }
          response-format:
            type: json_schema
            name: daily_brief
            schema:
              type: object
              properties:
                summary: { type: string, description: 2-3 sentence overview of the day }
                highlights: { type: array, items: { type: string } }
                prep_notes:
                  type: array
                  items:
                    type: object
                    properties: { patient_id: { type: string }, prep_note: { type: string } }
                    required: [patient_id, prep_note]
              required: [summary, highlights, prep_notes]
    health.scribe:
      active: 1
      versions:
        1:
          notes: New (2026-11-14) for the Health AI scribe (competitive review C6)
          system: >-
            You are a clinical scribe for a doctor in India. You get the transcript of one outpatient
            consultation, recorded with the patient's consent. The talk may mix Hindi, English and
            other Indian languages, and the transcript may have recognition errors. Write the doctor's
            note in English. Use only what was said: never add findings, doses or diagnoses that were
            not stated, and leave a field empty when the conversation does not cover it. Medicines are
            the ones the doctor said they are prescribing, with dose, frequency and duration only as
            said. For each diagnosis give an ICD-10 code (WHO) only when you are sure of it. List in
            uncertain anything you could not make out or that the doctor should check. The note is a
            draft: the doctor reviews and signs it.
          user: |
            Language of the consultation: {{language}}
            Patient: {{patient}}
            Transcript:
            {{transcript}}
          variables:
            language: { description: "the recording's language, such as hi-IN or en-IN" }
            patient: { untrusted: true, description: "age, sex, known allergies and current medicines" }
            transcript: { untrusted: true, description: "the consultation as transcribed, in order" }
          response-format:
            type: json_schema
            name: scribe_note
            schema:
              type: object
              properties:
                chief_complaint: { type: string }
                history: { type: string, description: history of the present illness, as told }
                examination: { type: string, description: findings the doctor said aloud }
                assessment: { type: string }
                diagnoses:
                  type: array
                  items:
                    type: object
                    properties:
                      display: { type: string }
                      icd10: { type: string, description: "WHO ICD-10 code such as J06.9, or empty" }
                      certainty: { type: string, enum: [confirmed, provisional] }
                    required: [display]
                medicines:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      dose: { type: string }
                      frequency: { type: string }
                      duration: { type: string }
                      route: { type: string }
                      instructions: { type: string }
                    required: [name]
                investigations: { type: array, items: { type: string } }
                advice: { type: string, description: what the patient was told to do, in English }
                follow_up_days: { type: integer }
                uncertain: { type: array, items: { type: string } }
              required: [chief_complaint, diagnoses, medicines, investigations, uncertain]
    accelerator.erp-query:
      active: 1
      versions:
        1:
          notes: New (Accelerator's AiQueryService answers from keyword templates today)
          system: >-
            You answer business questions over records from the company's ERP. Use only the records
            given. Classify the question, summarise what the records show in one or two sentences,
            and suggest at most three concrete next actions. If the records cannot answer it, say so.
          user: |
            Question: {{question}}

            Records ({{record_type}}):
            {{records}}
          variables:
            question: { untrusted: true }
            record_type: { required: false }
            records: { untrusted: true, required: false }
          response-format:
            type: json_schema
            name: erp_answer
            schema:
              type: object
              properties:
                intent:
                  type: string
                  enum: [inactive_customers, reorder_products, overdue_followups, top_customers, general]
                summary: { type: string }
                actions: { type: array, items: { type: string }, maxItems: 3 }
              required: [intent, summary, actions]
    meet.notes:
      active: 1
      versions:
        1:
          notes: New (2026-11-17) for Runvance Meet's AI notes (ai-demo-agent meet/docs/product/ai-meetings-plan.md, D3)
          system: |-
            You write the notes of one recorded meeting from its transcript. Each transcript line is
            "[id] time Name: text": id is the line's segment id (such as s123), time is when the line starts,
            counted from the start of the recording (m:ss or h:mm:ss), and Name is the person speaking. People
            may mix Hindi, English and other languages, and the transcript may have recognition errors.

            Rules:
            - Use only what the transcript says. Never add facts, figures, names, dates, decisions or
              commitments that nobody said. When something is unclear, leave it out rather than guess.
            - Cite the lines: every decision, action item and open question lists in segmentIds the ids of the
              lines that state it, exactly as written in the transcript (such as "s123"). Never make up an id.
            - Report what was said and agreed, never the people. Do not judge, rate, score, praise or criticise
              anyone or how they spoke, and never infer anything about a person from their voice, accent,
              tone, name or way of speaking (such as origin, gender, age, mood or ability).
            - Write in the meeting's main language (the one most of the talk is in) and give it in language as
              a BCP 47 code such as en or hi; when a notes language is given, write in that one instead. Keep
              names, product names and numbers as spoken.
            - Never invent items to fill a field. When nothing was decided, decisions is an empty array (the
              summary may say that no decisions were made); the same for action items and open questions.

            Fields:
            - summary: 4 to 8 sentences on what the meeting covered and where it ended.
            - decisions: what the participants agreed or decided.
            - actionItems: tasks someone took on or was asked to do. owner is the name of the person who will
              do it, as spoken in the meeting or the speaker who took it on, or null when nobody was named.
              due is the deadline exactly as said ("by Friday", "next week"), or null; never turn it into a
              calendar date.
            - chapters: the meeting's main parts in order, each with a short title, startMs (the time of its
              first line, in milliseconds from the start of the recording) and a one- or two-sentence summary.
            - questions: questions raised and still open when the meeting ended (not ones answered in it).
            - followUpEmail: a short, neutral email to the participants recapping the decisions and the action
              items with their owners. No names the transcript does not give, no sign-off name, and no
              promises beyond what was agreed.

            Long meetings come in parts, in order. When notes from earlier parts are given, return the notes
            of the whole meeting so far: keep their items and segment ids, and add or update what this part
            says.
          user: |
            Meeting title: {{title}}
            Participants: {{participants}}
            Notes language: {{notes_language}}
            Notes from earlier parts of this meeting:
            {{earlier_notes}}

            Transcript:
            {{transcript}}
          variables:
            transcript: { untrusted: true, description: "the meeting in order, one line per segment: [s123] 12:34 Name: text" }
            title: { untrusted: true, required: false, description: the meeting's title }
            participants: { untrusted: true, required: false, description: "the attendees' names, comma-separated" }
            notes_language: { required: false, description: "the workspace's notes language (en, hi), when it set one" }
            earlier_notes: { untrusted: true, required: false, description: "long meetings: the notes JSON of the parts before this one" }
          response-format:
            type: json_schema
            name: meeting_notes
            strict: true
            schema:
              type: object
              additionalProperties: false
              properties:
                summary: { type: string, description: 4 to 8 sentences }
                decisions:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      text: { type: string }
                      segmentIds: { type: array, items: { type: string } }
                    required: [text, segmentIds]
                actionItems:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      text: { type: string }
                      owner: { anyOf: [{ type: string }, { type: "null" }], description: "the name as spoken, or null" }
                      due: { anyOf: [{ type: string }, { type: "null" }], description: "the deadline as said, or null" }
                      segmentIds: { type: array, items: { type: string } }
                    required: [text, owner, due, segmentIds]
                chapters:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      title: { type: string }
                      startMs: { type: integer, description: milliseconds from the start of the recording }
                      summary: { type: string }
                    required: [title, startMs, summary]
                questions:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      text: { type: string }
                      segmentIds: { type: array, items: { type: string } }
                    required: [text, segmentIds]
                followUpEmail:
                  type: object
                  additionalProperties: false
                  properties:
                    subject: { type: string }
                    body: { type: string }
                  required: [subject, body]
                language: { type: string, description: "the notes' language, a BCP 47 code such as en or hi" }
              required: [summary, decisions, actionItems, chapters, questions, followUpEmail, language]

  # Rate limits and monthly budgets (USD, estimated). Placeholders until the owner sets them;
  # `default` applies to products / tenants without their own entry. Budgets count platform-key
  # spend only (a tenant's own key bills the tenant).
  limits:
    fail-open: true
    budget-scope: platform-keys
    products:
      default: { requests-per-minute: 3000, tokens-per-minute: 4000000 }
      interview: { requests-per-minute: 6000, tokens-per-minute: 8000000 }
    tenant-defaults:
      default: { requests-per-minute: 300, tokens-per-minute: 600000, monthly-budget-usd: 100 }
    tenant-overrides: {}
