# notification-service in staging: what differs from config/notification-service/.
# The context must exist: Spring Cloud Consul (fail-fast, `consul:` import) refuses to start when the
# active profile's context is missing ("config/pv-auth-service,staging/ ... does not exist", 2026-11-10).
runvance:
  environment: staging
app:
  # The platform tenant (PLATFORM_TENANT_ID): Runvance's own sender, the only tenant that may use the
  # platform SendGrid key; products' messages go out from it. Notify tenant "runvance-technologies",
  # linked to pv-auth-service organization runvance-technologies (Runvance Technologies) and approved
  # 2026-11-16. Not a secret. Each environment's Notify has its own tenant ids.
  platform-tenant-id: 6afb005c099db3337f42b85c
# The platform sender (info@runvance.com) is set for every environment in config/notification-service.
