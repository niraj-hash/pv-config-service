# Runvance Payroll (PeopleVizio, repo hr-ai-solution): public hosts, routes and access rules.
# The product has no sign-in or access code of its own: pg-api-gateway signs browsers in with
# pv-auth-service (BFF), checks every API request against the rules below, strips spoofable
# headers and passes the caller as X-PV-*. The app (Consul service payroll-api) trusts them.
#
# Generated from the @PreAuthorize annotations removed from the code (one rule per endpoint and
# method set, ordered most-specific first like Spring MVC, adjacent identical rules merged) and
# checked: every endpoint's first matching rule grants exactly what its annotation did.
#   439 rules: 234 by permission, 84 by role, 115 any signed-in member, 6 anonymous
# Payroll privacy (2026-11-09): payroll.read means "the organization's payroll" and only HR roles
# and payroll admins hold it; employees read their own payslips at /api/v1/me/payslips[/{runId}],
# and every endpoint keyed by an employee checks "own record or payroll.read" in the service.
#   @rbac.canRead('x') -> x.read (tenant_admin / super_admin hold "*")
#   isAnyAdmin -> tenant_admin, super_admin;  isHr -> + hr_manager, hr_admin, assistant_hr, hr_executive
#   isManagerOrAbove -> isHr + manager;  hasRole('SUPER_ADMIN') -> super_admin in the platform org
#   isAuthenticated / @selfScope (own records only: kept in the service) -> any signed-in member
# Anonymous paths check their own credential in the service: /webhooks/** (HMAC / provider
# signatures), /api/v1/public/** and /api/v1/branding/** (public careers, pricing, branding),
# /api/newsletter, /api/demo. Any endpoint not listed is refused.
# SCIM provisioning (/scim/v2/**, /api/v1/admin/scim/tokens) and per-tenant SSO were removed from the
# product on 9 November 2026 (platform decision: directories and sign-in are pv-auth-service's).
pv:
  gateway:
    products:
      payroll:
        name: Runvance Payroll
        hosts: [payroll.runvance.com, payroll.localhost]
        browser-sign-in: true
        routes:
          # Public lead forms and job applications: no sign-in, ten posts a minute per client address.
          - id: payroll-public-forms
            access: PUBLIC
            upstream: lb://payroll-api
            paths: ["/api/demo", "/api/newsletter", "/api/v1/public/{tenantCode}/apply"]
            max-body-bytes: 26214400
            rate-limit:
              key: CLIENT_IP
              replenish-rate: 1
              burst-capacity: 10
              requested-tokens: 6
              methods: [POST]
            # Was the service's own (AuthThrottleFilter, removed with sign-in): 30 requests per 5 minutes per client
            # address, shared by the demo and newsletter forms.
            rate-limits:
              - { key: CLIENT_IP, paths: ["/api/demo", "/api/newsletter"], replenish-rate: 1, burst-capacity: 300, requested-tokens: 10 }
          - id: payroll-api
            upstream: lb://payroll-api
            paths: ["/api/**", "/webhooks/**"]
            access: PROTECTED
            default-rule: DENY
            max-body-bytes: 52428800      # 50 MB multipart uploads (documents, bulk imports)
            response-timeout-ms: 120000   # AI features wait up to 60 s on the model
            rules:
              - paths: ["/api/demo", "/api/newsletter"]
                methods: [POST]
                anonymous: true
              - paths: ["/api/v1/admin/api-keys"]
                methods: [GET, POST]
                roles: [tenant_admin, super_admin]
              - paths: ["/api/v1/admin/api-keys/{id}/revoke"]
                methods: [POST]
                roles: [tenant_admin, super_admin]
              - paths: ["/api/v1/admin/audit-logs", "/api/v1/admin/audit-logs/export.csv"]
                methods: [GET]
                permissions: [audit_log.read]
              - paths: ["/api/v1/admin/leads/demo", "/api/v1/admin/leads/newsletter"]
                methods: [GET]
                roles: [super_admin]
                orgs: [platform]
              - paths: ["/api/v1/ai/assistant/chat"]
                methods: [POST]
              - paths: ["/api/v1/ai/copilot/digest"]
                methods: [GET]
                roles: [super_admin, tenant_admin, hr_manager, hr_admin, assistant_hr, hr_executive]
              - paths: ["/api/v1/ai/copilot/digest/run-now"]
                methods: [POST]
                roles: [tenant_admin, super_admin]
              - paths: ["/api/v1/ai/explain-payslip", "/api/v1/ai/parse-receipt"]
                methods: [POST]
              - paths: ["/api/v1/ai/parse-resume"]
                methods: [POST]
                permissions: [requisition.create]
              - paths: ["/api/v1/ai/screening/duplicates/{candidateId}"]
                methods: [GET]
                permissions: [requisition.read]
              - paths: ["/api/v1/ai/screening/match-jd", "/api/v1/ai/screening/rank-candidates"]
                methods: [POST]
                permissions: [requisition.read]
              - paths: ["/api/v1/ai/workforce/agents"]
                methods: [GET]
              - paths: ["/api/v1/ai/workforce/agents/analytics/run"]
