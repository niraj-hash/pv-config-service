# Runvance Health (HMS): hosts, routes and RBAC rules. Generated from the HMS controllers' former role
# checks (hms repo, branch platform/gateway-auth); every endpoint is listed, anything else is denied.
# Roles are pv-auth-service's hms catalog keys (config/pv-auth-service/conf.d/hms.yml).
pv:
  gateway:
    products:
      hms:
        name: Runvance Health
        hosts: [health.runvance.com, hms.localhost]
        browser-sign-in: true
        routes:
          # Called by the e-Sign provider (server to server). The separate marketing site on the old
          # domain is retired (2026-11-09), so nothing calls these cross-origin any more.
          - id: hms-public
            upstream: lb://hms-api
            paths: ["/api/v1/public/**"]
            access: PROTECTED
            rules:
              # Prices are for signed-in customers only (sales gives them to anyone else on request).
              - paths: ["/api/v1/public/plans", "/api/v1/public/plans/**"]
              # ping, inquiries; e-Sign webhook (ESIGN_WEBHOOK_SECRET checked by the service)
              - paths: ["/api/v1/public/**"]
                anonymous: true
            rate-limits:
              - { key: CLIENT_IP, replenish-rate: 1, burst-capacity: 10, requested-tokens: 6, paths: ["/api/v1/public/inquiries"], methods: [POST] }
              # Online booking, payment links and feedback forms are anonymous: a few per address.
              - { key: CLIENT_IP, replenish-rate: 1, burst-capacity: 10, requested-tokens: 3, paths: ["/api/v1/public/clinics/*/booking-requests", "/api/v1/public/pay/*/payu", "/api/v1/public/feedback/*"], methods: [POST] }
              - { key: CLIENT_IP, replenish-rate: 5, burst-capacity: 60, paths: ["/api/v1/public/clinics/**", "/api/v1/public/pay/**", "/api/v1/public/feedback/**"], methods: [GET] }
              # The status page polls every minute; cached for 30 s by the API.
              - { key: CLIENT_IP, replenish-rate: 2, burst-capacity: 20, paths: ["/api/v1/public/status"], methods: [GET] }
          - id: hms-api
            upstream: lb://hms-api
            paths: ["/api/**"]
            access: PROTECTED
            default-rule: DENY
            max-body-bytes: 26214400 # uploads (storage, patient documents, migration import)
            response-timeout-ms: 120000 # AI suggestions, enterprise seed, data migration
            rules:
              # ── /api/v1/abdm
              - paths: ["/api/v1/abdm/abha"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/abdm/abha/{patientId}"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/abdm/abha/{patientId}/link"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/abdm/consent/{patientId}"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/abdm/status"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/abdm/care-contexts/{patientId}"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/abdm/share-tokens"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, receptionist]
              - paths: ["/api/v1/abdm/share-tokens/{id}/complete"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, receptionist]
              - paths: ["/api/v1/abdm/hiu/consent/{patientId}"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, doctor]
              - paths: ["/api/v1/abdm/hiu/records/{patientId}"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse]
              # ── /api/v1/appointments
              - paths: ["/api/v1/appointments"]
                methods: [GET] # any signed-in member
              - paths: ["/api/v1/appointments"]
                methods: [POST]
                roles: [super_admin, clinic_admin, hospital_admin, staff, receptionist]
              - paths: ["/api/v1/appointments/{appointmentId}"]
                methods: [GET] # any signed-in member
              - paths: ["/api/v1/appointments/{appointmentId}"]
                methods: [PUT, PATCH]
                roles: [super_admin, clinic_admin, hospital_admin, staff, receptionist, doctor]
              - paths: ["/api/v1/appointments/{appointmentId}"]
                methods: [DELETE]
                roles: [super_admin, clinic_admin, hospital_admin, staff, receptionist]
              - paths: ["/api/v1/appointments/{appointmentId}/cancel"]
                methods: [POST]
                roles: [super_admin, clinic_admin, hospital_admin, staff, receptionist, doctor, patient]
              - paths: ["/api/v1/appointments/{appointmentId}/checkin"]
                methods: [POST]
                roles: [super_admin, clinic_admin, hospital_admin, staff, receptionist, doctor]
              # ── /api/v1/audit-logs
              - paths: ["/api/v1/audit-logs"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin]
              # ── /api/v1/billing (one billing area for OPD and IPD; refunds, credit notes, discounts and
              #    cancelling also need billing.approve, which the API checks)
              - paths: ["/api/v1/billing/bills", "/api/v1/billing/bills/{id}", "/api/v1/billing/summary"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, receptionist, accountant]
              - paths: ["/api/v1/billing/bills", "/api/v1/billing/appointments/{appointmentId}/bill",
                        "/api/v1/billing/bills/{id}/items", "/api/v1/billing/bills/{id}/finalize",
                        "/api/v1/billing/bills/{id}/payments"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, receptionist, accountant]
              - paths: ["/api/v1/billing/bills/{id}/items/{lineId}"]
                methods: [DELETE]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, receptionist, accountant]
              - paths: ["/api/v1/billing/bills/{id}/payer"]
                methods: [PUT]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, receptionist, accountant]
              - paths: ["/api/v1/billing/bills/{id}/discount"]
                methods: [PUT]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, accountant]
              - paths: ["/api/v1/billing/bills/{id}/refunds", "/api/v1/billing/bills/{id}/credit-notes", "/api/v1/billing/bills/{id}/cancel"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, accountant]
              # ── Hospital departments: /api/v1/blood-bank, /api/v1/cssd, /api/v1/diet, /api/v1/mrd
              - paths: ["/api/v1/blood-bank/stock", "/api/v1/blood-bank/units", "/api/v1/blood-bank/requests"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, lab_technician]
              - paths: ["/api/v1/blood-bank/requests"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse]
              - paths: ["/api/v1/blood-bank/units", "/api/v1/blood-bank/units/{id}/screening", "/api/v1/blood-bank/units/{id}/discard",
                        "/api/v1/blood-bank/donors", "/api/v1/blood-bank/donors/{id}/donations", "/api/v1/blood-bank/requests/{id}/issue"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, lab_technician]
              - paths: ["/api/v1/cssd/sets", "/api/v1/cssd/cycles/{id}/trace"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, nurse, inventory_manager, doctor]
              - paths: ["/api/v1/cssd/sets", "/api/v1/cssd/sets/{id}/clean", "/api/v1/cssd/sets/{id}/issue", "/api/v1/cssd/sets/{id}/return", "/api/v1/cssd/cycles"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, nurse, inventory_manager]
              - paths: ["/api/v1/diet/kitchen"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, nurse, doctor]
              - paths: ["/api/v1/diet/admissions/{admissionId}"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, nurse, doctor]
              - paths: ["/api/v1/mrd/monthly", "/api/v1/mrd/files/out"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, receptionist]
              - paths: ["/api/v1/mrd/files/{patientId}/issue", "/api/v1/mrd/files/movements/{id}/return"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, receptionist]
              # ── /api/v1/booking-requests (online booking: the front desk confirms or declines)
              - paths: ["/api/v1/booking-requests"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, receptionist]
              - paths: ["/api/v1/booking-requests/{id}/confirm", "/api/v1/booking-requests/{id}/decline"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, receptionist]
              # ── /api/v1/chain (branches of one owner; head-office-only actions are checked by the API)
              - paths: ["/api/v1/chain", "/api/v1/chain/referrals", "/api/v1/chain/patients/{patientId}/other-branches"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist]
              - paths: ["/api/v1/chain/dashboard"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin]
              - paths: ["/api/v1/chain", "/api/v1/chain/join-code", "/api/v1/chain/join", "/api/v1/chain/masters/push"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin]
              - paths: ["/api/v1/chain/referrals", "/api/v1/chain/referrals/{id}/accept"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist]
              # ── /api/v1/claims (cashless claim cases: pre-auth, enhancement, discharge, final, settlement)
              - paths: ["/api/v1/claims", "/api/v1/claims/ageing", "/api/v1/claims/denials", "/api/v1/claims/{id}"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, accountant, receptionist]
              - paths: ["/api/v1/claims/from-bill/{billId}", "/api/v1/claims/{id}/submit", "/api/v1/claims/{id}/response",
                        "/api/v1/claims/{id}/query-answer", "/api/v1/claims/{id}/settle", "/api/v1/claims/{id}/documents"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, accountant]
              # ── /api/v1/clinics
              - paths: ["/api/v1/clinics"]
                methods: [GET, POST]
                roles: [super_admin]
                orgs: [platform]
              - paths: ["/api/v1/clinics/info"]
                methods: [GET] # any signed-in member
              - paths: ["/api/v1/clinics/me"]
                methods: [GET, PATCH]
                roles: [super_admin, clinic_admin]
              - paths: ["/api/v1/clinics/{clinicId}"]
                methods: [GET, PUT, PATCH, DELETE]
                roles: [super_admin]
                orgs: [platform]
              - paths: ["/api/v1/clinics/{clinicId}/rooms"]
                methods: [GET] # any signed-in member
              # ── /api/v1/coding (ICD-10 and LOINC look-up for pickers; a clinic's own code imports)
              - paths: ["/api/v1/coding/icd10", "/api/v1/coding/loinc"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/coding/{system}/import"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin]
              # ── /api/v1/data-export, /api/v1/fhir, /api/v1/webhooks (the clinic's own data; API clients use the integration role)
              - paths: ["/api/v1/data-export"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin]
              - paths: ["/api/v1/fhir/metadata", "/api/v1/fhir/Patient", "/api/v1/fhir/Patient/{id}", "/api/v1/fhir/Patient/{id}/$everything"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, integration]
              - paths: ["/api/v1/webhooks", "/api/v1/webhooks/{id}/deliveries"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin]
              - paths: ["/api/v1/webhooks", "/api/v1/webhooks/{id}/test"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin]
              - paths: ["/api/v1/webhooks/{id}"]
                methods: [DELETE]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin]
              # ── /api/v1/dashboard
              - paths: ["/api/v1/dashboard/clinic-admin"]
                methods: [GET]
                roles: [super_admin, clinic_admin, staff]
              - paths: ["/api/v1/dashboard/doctor"]
                methods: [GET]
                roles: [doctor]
              - paths: ["/api/v1/dashboard/patient"]
                methods: [GET]
                roles: [patient]
              - paths: ["/api/v1/dashboard/staff"]
                methods: [GET]
                roles: [super_admin, clinic_admin, staff]
              - paths: ["/api/v1/dashboard/super-admin"]
                methods: [GET]
                roles: [super_admin]
                orgs: [platform]
              - paths: ["/api/v1/dashboard/super-admin/clinics-analytics"]
                methods: [GET]
                roles: [super_admin]
                orgs: [platform]
              - paths: ["/api/v1/dashboard/super-admin/doctors-analytics"]
                methods: [GET]
                roles: [super_admin]
                orgs: [platform]
              # ── /api/v1/departments
              - paths: ["/api/v1/departments"]
                methods: [GET, POST] # any signed-in member
              - paths: ["/api/v1/departments/{id}"]
                methods: [GET, PUT, DELETE]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              # ── /api/v1/doctor-assist
              - paths: ["/api/v1/doctor-assist/daily-brief"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              # ── /api/v1/doctors
              - paths: ["/api/v1/doctors"]
                methods: [GET] # any signed-in member
              - paths: ["/api/v1/doctors"]
                methods: [POST]
                roles: [super_admin, clinic_admin, hospital_admin]
              - paths: ["/api/v1/doctors/me"]
                methods: [GET] # any signed-in member
              - paths: ["/api/v1/doctors/{doctorId}"]
                methods: [GET] # any signed-in member
              - paths: ["/api/v1/doctors/{doctorId}"]
                methods: [PUT, PATCH]
                roles: [super_admin, clinic_admin, hospital_admin]
              - paths: ["/api/v1/doctors/{doctorId}/availability"]
                methods: [GET] # any signed-in member
              - paths: ["/api/v1/doctors/{doctorId}/availability"]
                methods: [POST]
                roles: [super_admin, clinic_admin, hospital_admin]
              - paths: ["/api/v1/doctors/{doctorId}/schedule"]
                methods: [GET] # any signed-in member
              - paths: ["/api/v1/doctors/{doctorId}/schedule"]
                methods: [PUT]
                roles: [super_admin, clinic_admin, hospital_admin]
              - paths: ["/api/v1/doctors/{doctorId}/slots"]
                methods: [GET] # any signed-in member
              # ── /api/v1/drug-db
              - paths: ["/api/v1/drug-db/catalog/import"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/drug-db/catalog/search"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/drug-db/interactions"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/drug-db/status"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              # ── /api/v1/einvoice
              - paths: ["/api/v1/einvoice/generate/{invoiceId}"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/einvoice/status"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/einvoice/{invoiceId}"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              # ── /api/v1/erp
              - paths: ["/api/v1/erp/bed-board"]
