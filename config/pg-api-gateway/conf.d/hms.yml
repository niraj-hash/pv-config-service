                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/erp/bills"]
                methods: [GET, POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/erp/bills/{id}/finalize"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/erp/bills/{id}/items"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/erp/buildings"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/erp/buildings"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin]
              - paths: ["/api/v1/erp/charges"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/erp/charges"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin]
              - paths: ["/api/v1/erp/dashboard"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/erp/emergency"]
                methods: [GET, POST]
