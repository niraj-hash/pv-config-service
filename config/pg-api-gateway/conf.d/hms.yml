# Runvance Health (HMS): hosts, routes and RBAC rules. Generated from the HMS controllers' former role
# checks (hms repo, branch platform/gateway-auth); every endpoint is listed, anything else is denied.
# Roles are pv-auth-service's hms catalog keys (config/pv-auth-service/conf.d/hms.yml).
pv:
  gateway:
    products:
      hms:
        name: Runvance Health
        hosts: [health.runvance.com, hms.localhost]
        browser-sign-in: true
        routes:
          # Called by the e-Sign provider (server to server). The separate marketing site on the old
          # domain is retired (2026-11-09), so nothing calls these cross-origin any more.
          - id: hms-public
            upstream: lb://hms-api
            paths: ["/api/v1/public/**"]
            access: PROTECTED
            rules:
              # Prices are for signed-in customers only (sales gives them to anyone else on request).
              - paths: ["/api/v1/public/plans", "/api/v1/public/plans/**"]
              # ping, inquiries; e-Sign webhook (ESIGN_WEBHOOK_SECRET checked by the service)
              - paths: ["/api/v1/public/**"]
                anonymous: true
            rate-limit: { key: CLIENT_IP, replenish-rate: 1, burst-capacity: 10, requested-tokens: 6, paths: ["/api/v1/public/inquiries"], methods: [POST] }
          - id: hms-api
            upstream: lb://hms-api
            paths: ["/api/**"]
            access: PROTECTED
            default-rule: DENY
            max-body-bytes: 26214400 # uploads (storage, patient documents, migration import)
            response-timeout-ms: 120000 # AI suggestions, enterprise seed, data migration
            rules:
              # ── /api/v1/abdm
              - paths: ["/api/v1/abdm/abha"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/abdm/abha/{patientId}"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/abdm/abha/{patientId}/link"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/abdm/consent/{patientId}"]
                methods: [POST]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              - paths: ["/api/v1/abdm/status"]
                methods: [GET]
                roles: [super_admin, tenant_admin, clinic_admin, hospital_admin, staff, doctor, nurse, receptionist, pharmacist, lab_technician, accountant, inventory_manager, hr_manager]
              # ── /api/v1/appointments
              - paths: ["/api/v1/appointments"]
                methods: [GET] # any signed-in member
              - paths: ["/api/v1/appointments"]
                methods: [POST]
                roles: [super_admin, clinic_admin, hospital_admin, staff, receptionist]
              - paths: ["/api/v1/appointments/{appointmentId}"]
                methods: [GET] # any signed-in member
              - paths: ["/api/v1/appointments/{appointmentId}"]
                methods: [PUT, PATCH]
                roles: [super_admin, clinic_admin, hospital_admin, staff, receptionist, doctor]
              - paths: ["/api/v1/appointments/{appointmentId}"]
                methods: [DELETE]
                roles: [super_admin, clinic_admin, hospital_admin, staff, receptionist]
              - paths: ["/api/v1/appointments/{appointmentId}/cancel"]
                methods: [POST]
                roles: [super_admin, clinic_admin, hospital_admin, staff, receptionist, doctor, patient]
              - paths: ["/api/v1/appointments/{appointmentId}/checkin"]
                methods: [POST]
                roles: [super_admin, clinic_admin, hospital_admin, staff, receptionist, doctor]
              # ── /api/v1/audit-logs
