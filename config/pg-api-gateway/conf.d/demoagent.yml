      demoagent-api:
        name: Runvance Connect API
        hosts: [connect-api.runvance.com, api.demoagent.localhost]
        browser-sign-in: false
        routes:
          - id: demoagent-api-socket
            upstream: lb://demoagent-platform
            paths: ["/ws/sessions/*"]
            access: PROTECTED
            response-timeout-ms: -1
            rules:
              - paths: ["/ws/sessions/*"]
                anonymous: true             # ?token= participant token, checked by the service
            # 20 connections at once, then one every two seconds, per client address (was the service's SOCKET limit).
            rate-limit: { key: CLIENT_IP, replenish-rate: 1, burst-capacity: 40, requested-tokens: 2 }
          - id: demoagent-api-public
            upstream: lb://demoagent-platform
            paths: ["/api/v1/public/**"]
            access: PROTECTED
            response-timeout-ms: 120000
            rules:
              - paths: ["/api/v1/public/**"]
                anonymous: true             # capability tokens in the path, pk_ keys, signed LeadOS webhook
            # 60 at once, then two a second, per client address (was the service's PUBLIC limit).
            rate-limit: { key: CLIENT_IP, replenish-rate: 2, burst-capacity: 60 }
            cors:                           # the widget on customers' sites and the prospect site
              allowed-origins: ["*"]
              allowed-methods: [GET, POST]
              allowed-headers: [Content-Type, Idempotency-Key, Authorization]
              exposed-headers: [X-Trace-Id]
          - id: demoagent-api-server
            upstream: lb://demoagent-platform
            paths: ["/api/v1/**"]
            access: PROTECTED
            default-rule: DENY
            max-body-bytes: 57671680
            response-timeout-ms: 300000
            # Every endpoint is anonymous here: callers are customers' servers with this product's sk_ keys, which
            # the service checks itself (key, organization, product scope, and the key role's permission from the
            # same table as the console rules). A request without a valid key is refused by the service (401).
            # pv-auth-service tokens are not accepted here: people and their apps use the console host.
            rules:
              - paths: ["/api/v1/agent-personas"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/agents/{agentId}"]
                methods: [GET, PATCH]
                anonymous: true
