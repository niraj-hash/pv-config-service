# Runvance Connect (repo ai-demo-agent, pv-auth-service product key "demoagent"): its public hosts and RBAC rules.
# pg-api-gateway signs people in with pv-auth-service, applies these rules and passes the identity as X-PV-*
# headers; the service (Consul: demoagent-platform, platform-app) has no sign-in or role checks of its own.
#
# The per-endpoint rules are GENERATED from ai-demo-agent services/platform-core/src/main/resources/access/
# api-access.txt (the table the service also applies to its own API keys; ApiAccessCoverageTest keeps it equal
# to the controllers). Change that table, then regenerate; do not edit the rule lists by hand.
# Permissions (catalog in config/pv-auth-service/conf.d/demoagent.yml): workspace.read < demo.operate <
# product.configure < org.manage, taken over 1:1 from the @PreAuthorize annotations they replace.
#
# Three gateway entries, because every route of an entry applies to all of its hosts:
#   demoagent      the consoles (Connect and Assessment, one web app) and the person-facing API, behind sign-in;
#   demoagent-api  the API host for machines and prospects: the service's own sk_/pk_ API keys (server-to-server),
#                  the embeddable widget and public pages (cors *), the demo-room WebSocket (participant token),
#                  calendar OAuth callbacks (signed state). Anonymous here: the service checks each credential;
#   demoagent-site the prospect site (booking pages, demo rooms): pages only.
# /internal/** (browser-worker callbacks, X-Worker-Token) is never routed: the worker calls the service inside
# the network (PLATFORM_INTERNAL_URL).
pv:
  gateway:
    products:
      demoagent:
        name: Runvance Connect
        hosts: [connect.runvance.com, assessment.runvance.com, demoagent.localhost, assessment.demoagent.localhost]
        browser-sign-in: true
        routes:
          - id: demoagent-console-api
            upstream: lb://demoagent-platform
            paths: ["/api/v1/**"]
            access: PROTECTED
            default-rule: DENY
            max-body-bytes: 57671680        # product bundles and knowledge files (55 MB, as the service accepts)
            response-timeout-ms: 300000     # AI generation (agents, manifests from a site) takes minutes
            rules:
              - paths: ["/api/v1/agent-personas"]
                methods: [GET]
                permissions: [workspace.read]
              - paths: ["/api/v1/agents/{agentId}"]
                methods: [GET]
                permissions: [workspace.read]
              - paths: ["/api/v1/agents/{agentId}"]
                methods: [PATCH]
                permissions: [product.configure]
              - paths: ["/api/v1/agents/{agentId}/eval-runs"]
