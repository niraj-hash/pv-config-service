              - paths: ["/api/v1/ad-studio/music"]
                methods: [GET]
                permissions: [ad.read]
              - paths: ["/api/v1/ad-studio/options"]
                methods: [GET]
                permissions: [ad.read]
              - paths: ["/api/v1/ad-studio/projects"]
                methods: [GET]
                permissions: [ad.read]
              - paths: ["/api/v1/ad-studio/projects", "/api/v1/ad-studio/projects/{projectId}/generate-script"]
