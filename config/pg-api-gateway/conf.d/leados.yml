# LeadOS (PayVizio LeadOS: CRM, Meta ads, WhatsApp). One Spring Boot service, leados-api, behind the
# gateway; the React app is leados-web. LeadOS has no sign-in or permission code of its own: every
# rule below replaces a @RequiresPermission (or an OWNER/ADMIN/SUPERADMIN check) that was in the
# code. Generated from the controllers (method + path + permission per endpoint) at the commit that
# removed them; PayVizio-LeadOS's GatewayRulesCoverEveryEndpointTest fails when an endpoint has no
# rule here. Inside a route, the most specific path comes first, so the first matching rule is the
# endpoint Spring MVC would pick.
#
# Service-guarded (anonymous: true, the service checks its own credential): Meta / WhatsApp /
# SendGrid / PayVizio / demo-booking / MyOperator / TeleCMI webhooks (signatures or a random
# per-workspace key), the Meta and Google OAuth callbacks (signed state), /api/v1/public/** (site
# key, random link tokens, signed media URLs), and the MCP connector (/mcp, its OAuth server and
# /api/v1/integrations/**: LeadOS's own lok_ API keys and MCP OAuth tokens for AI clients).
pv:
  gateway:
    products:
      leados:
        name: LeadOS
        hosts: [crm.runvance.com, crm-api.runvance.com, leads.localhost]
        browser-sign-in: true
        routes:
          # The MCP connector for AI clients (Claude, ChatGPT, MCP Inspector): its own bearer
          # tokens, its own OAuth server. GET /mcp is a server-sent event stream.
          - id: leados-mcp
            upstream: lb://leados-api
            paths: ["/mcp", "/mcp/", "/oauth/authorize", "/oauth/token", "/oauth/register", "/oauth/revoke",
                    "/.well-known/oauth-authorization-server", "/.well-known/oauth-authorization-server/**",
                    "/.well-known/oauth-protected-resource", "/.well-known/oauth-protected-resource/**"]
            response-timeout-ms: -1
            rules:
              - paths: ["/.well-known/oauth-authorization-server"]
                methods: [GET]
                anonymous: true
              - paths: ["/.well-known/oauth-authorization-server/mcp"]
                methods: [GET]
                anonymous: true
              - paths: ["/.well-known/oauth-protected-resource"]
                methods: [GET]
                anonymous: true
              - paths: ["/.well-known/oauth-protected-resource/mcp"]
                methods: [GET]
                anonymous: true
              - paths: ["/mcp"]
                methods: [DELETE, GET, POST]
                anonymous: true
              - paths: ["/mcp/"]
                methods: [DELETE, GET, POST]
                anonymous: true
              - paths: ["/oauth/authorize"]
                methods: [GET]
                anonymous: true
              - paths: ["/oauth/register"]
                methods: [POST]
                anonymous: true
              - paths: ["/oauth/revoke"]
                methods: [POST]
                anonymous: true
              - paths: ["/oauth/token"]
                methods: [POST]
                anonymous: true
            # Was the service's own. Per client address (AuthRateLimitFilter): client registration 30 a minute, token
            # requests 300 a minute; every Claude.ai or ChatGPT user connecting arrives from a few platform addresses.
            # MCP calls (McpServerController): 120 a minute per connection, i.e. its lok_ key or loa_ token.
            rate-limits:
              - { key: CLIENT_IP, paths: ["/oauth/register"], methods: [POST], replenish-rate: 1, burst-capacity: 60, requested-tokens: 2 }
              - { key: CLIENT_IP, paths: ["/oauth/token"], methods: [POST], replenish-rate: 5, burst-capacity: 300 }
              - { key: API_KEY, headers: [Authorization], paths: ["/mcp", "/mcp/"], methods: [POST], replenish-rate: 2, burst-capacity: 120 }
            cors:
              allowed-origins: ["*"]
              allowed-methods: [GET, POST, DELETE]
              allowed-headers: [Authorization, Content-Type, Accept, Mcp-Session-Id, MCP-Protocol-Version, Last-Event-ID]
              exposed-headers: [Mcp-Session-Id, WWW-Authenticate]
          # Server-to-server API for other products (ai-demo-agent): LeadOS lok_ API keys,
          # checked by the service.
          - id: leados-integrations
            upstream: lb://leados-api
            paths: ["/api/v1/integrations/**"]
            # Was the service's own (IntegrationGate): 120 calls a minute per lok_ key; demo-access/resolve isn't gated.
            rate-limit: { key: API_KEY, headers: [Authorization], exclude-paths: ["/api/v1/integrations/demo-access/resolve"], replenish-rate: 2, burst-capacity: 120 }
            rules:
              - paths: ["/api/v1/integrations/demo-access/resolve"]
                methods: [POST]
                anonymous: true
              - paths: ["/api/v1/integrations/email/templates"]
                methods: [GET, POST]
                anonymous: true
              - paths: ["/api/v1/integrations/email/messages", "/api/v1/integrations/email/messages/{messageId}/cancel"]
                methods: [POST]
                anonymous: true
              - paths: ["/api/v1/integrations/email/templates/{templateId}"]
                methods: [DELETE, PUT]
                anonymous: true
              - paths: ["/api/v1/integrations/messages/export", "/api/v1/integrations/messages", "/api/v1/integrations/messages/{messageId}"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/integrations/usage"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/integrations/whatsapp/templates/sync"]
                methods: [POST]
                anonymous: true
              - paths: ["/api/v1/integrations/whatsapp/templates"]
                methods: [GET, POST]
                anonymous: true
              - paths: ["/api/v1/integrations/whatsapp/messages", "/api/v1/integrations/whatsapp/messages/{messageId}/cancel"]
                methods: [POST]
                anonymous: true
          # Reached by people with no account: forms on customers' websites, links sent to schools,
          # media Meta fetches. Each checks its own credential (site key, random token, signature).
          - id: leados-public
            upstream: lb://leados-api
            paths: ["/api/v1/public/**"]
            rules:
              - paths: ["/api/v1/public/ad-studio/media/{assetId}"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/public/agreements/{token}/code", "/api/v1/public/agreements/{token}/sign"]
                methods: [POST]
                anonymous: true
              - paths: ["/api/v1/public/agreements/{token}/pdf", "/api/v1/public/agreements/{token}"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/public/demo-feedback/{token}"]
                methods: [GET, POST]
                anonymous: true
              - paths: ["/api/v1/public/demo-requests"]
                methods: [POST]
                anonymous: true
              - paths: ["/api/v1/public/forms/{slug}/submit"]
                methods: [POST]
                anonymous: true
              - paths: ["/api/v1/public/forms/{slug}"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/public/integrations/demo-booking/{connectionId}", "/api/v1/public/integrations/myoperator/{webhookKey}", "/api/v1/public/integrations/telecmi/{webhookKey}"]
                methods: [POST]
                anonymous: true
              - paths: ["/api/v1/public/leads"]
                methods: [POST]
                anonymous: true
              - paths: ["/api/v1/public/merchant-forms/{publicSlug}/submissions"]
                methods: [POST]
                anonymous: true
              - paths: ["/api/v1/public/merchant-forms/{publicSlug}"]
                methods: [GET]
                anonymous: true
              # Prices are for signed-in customers only (sales gives them to anyone else on request).
              - paths: ["/api/v1/public/plans"]
                methods: [GET]
              - paths: ["/api/v1/public/proposals/{token}/pdf", "/api/v1/public/proposals/{token}"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/public/questionnaires/{token}"]
                methods: [GET, POST]
                anonymous: true
              - paths: ["/api/v1/public/whatsapp-media/{mediaId}"]
                methods: [GET]
                anonymous: true
            # Every post: 60 at once, then two a second per client address (the gateway's own ceiling).
            rate-limit: { key: CLIENT_IP, replenish-rate: 2, burst-capacity: 60, methods: [POST] }
            # Was the service's own (AuthRateLimitFilter). Per client address: website lead forms 60 a minute, demo
            # requests 10 a minute. Links sent to schools (questionnaires, demo feedback, agreement codes and signing):
            # 10 posts a minute per link (the service counted per link and address).
            rate-limits:
              - { key: CLIENT_IP, paths: ["/api/v1/public/leads"], methods: [POST], replenish-rate: 1, burst-capacity: 60 }
              - { key: CLIENT_IP, paths: ["/api/v1/public/demo-requests"], methods: [POST], replenish-rate: 1, burst-capacity: 60, requested-tokens: 6 }
              - { key: GUEST, path-variable: token, paths: ["/api/v1/public/questionnaires/{token}", "/api/v1/public/demo-feedback/{token}"], methods: [POST], replenish-rate: 1, burst-capacity: 60, requested-tokens: 6 }
              - { key: GUEST, path-variable: token, paths: ["/api/v1/public/agreements/{token}/code"], methods: [POST], replenish-rate: 1, burst-capacity: 60, requested-tokens: 6 }
              - { key: GUEST, path-variable: token, paths: ["/api/v1/public/agreements/{token}/sign"], methods: [POST], replenish-rate: 1, burst-capacity: 60, requested-tokens: 6 }
            cors:
              allowed-origins: ["*"]
              allowed-methods: [GET, POST]
              allowed-headers: [Content-Type, X-Site-Key]
          # Ad Studio source videos: up to 2 GB, probed with ffprobe before the response.
          - id: leados-ad-studio-uploads
            upstream: lb://leados-api
            paths: ["/api/v1/ad-studio/projects/*/upload", "/api/v1/ad-studio/media/upload"]
            max-body-bytes: 2147483648
            response-timeout-ms: -1
            rules:
              - paths: ["/api/v1/ad-studio/media/upload"]
                methods: [POST]
                permissions: [ad.write]
              - paths: ["/api/v1/ad-studio/projects/{projectId}/upload"]
                methods: [POST]
                permissions: [ad.write]
          - id: leados-api
            upstream: lb://leados-api
            paths: ["/api/**"]
            max-body-bytes: 104857600 # lead files (50 MB each), CSV imports, payment receipts
            response-timeout-ms: 120000 # AI briefs and scoring, Meta Graph syncs
            # Was the service's own (AuthRateLimitFilter): the PayVizio billing webhook, 60 a minute per client address.
            rate-limit: { key: CLIENT_IP, paths: ["/api/v1/billing/webhooks/payvizio"], methods: [POST], replenish-rate: 1, burst-capacity: 60 }
            rules:
              # access
              - paths: ["/api/v1/access/me"]
                methods: [GET]
              # ad-studio
              - paths: ["/api/v1/ad-studio/analytics"]
                methods: [GET]
                permissions: [ad.read]
              - paths: ["/api/v1/ad-studio/analytics/variants/{variantId}"]
                methods: [POST]
                permissions: [ad.write]
              - paths: ["/api/v1/ad-studio/brand-kits"]
                methods: [GET]
                permissions: [ad.read]
              - paths: ["/api/v1/ad-studio/brand-kits", "/api/v1/ad-studio/brand-kits/{brandKitId}/default"]
                methods: [POST]
                permissions: [ad.write]
              - paths: ["/api/v1/ad-studio/brand-kits/{brandKitId}"]
