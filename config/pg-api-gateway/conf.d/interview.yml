        hosts: [api.interview.runvance.com, api.interview.localhost]
        browser-sign-in: false
        routes:
          # Live media from the interview room: the signed, expiring URL (SignedUrls, HMAC) is the credential.
          - id: interview-api-media
            upstream: lb://interview-api
            paths: ["/media/ingest"]
            access: PROTECTED
            response-timeout-ms: -1
            rules:
              - paths: ["/media/ingest"]
                anonymous: true
          # Provider callbacks, each verified by its provider's signature in the service (LiveKit, Slack, Teams Bot
          # Connector JWT, the ATS connection's secret). No SMS or WhatsApp provider callbacks: those go through Runvance Notify.
          - id: interview-api-webhooks
            upstream: lb://interview-api
            paths: ["/api/v1/webhooks/ats/{tenantId}/{connectionId}", "/api/v1/webhooks/livekit", "/api/v1/webhooks/slack", "/api/v1/webhooks/teams"]
            access: PROTECTED
            default-rule: DENY
            rules:
              - paths: ["/api/v1/webhooks/ats/{tenantId}/{connectionId}", "/api/v1/webhooks/livekit", "/api/v1/webhooks/slack", "/api/v1/webhooks/teams"]
                methods: [POST]
                anonymous: true
          # The public job board, as the API host always served it.
          - id: interview-api-public
            upstream: lb://interview-api
            paths: ["/public/v1/orgs/**"]
            access: PROTECTED
            default-rule: DENY
            rules:
              - paths: ["/public/v1/orgs/{slug}/jobs"]
                methods: [GET]
                anonymous: true
              - paths: ["/public/v1/orgs/{slug}/jobs/{jobId}/applications:start"]
                methods: [POST]
                anonymous: true
              - paths: ["/public/v1/orgs/{slug}/jobs/{jobId}"]
                methods: [GET]
                anonymous: true
              - paths: ["/public/v1/orgs/{slug}/logo/{digest}"]
                methods: [GET]
                anonymous: true
            # Was the service's own, per client address, one bucket for both hosts: reads 300 at once, then five a second
            # (PublicRateLimitFilter); application starts 20 an hour (CareersService; its per-email limit stays there).
            rate-limits:
              - { bucket: interview-public-ip, key: CLIENT_IP, methods: [GET], replenish-rate: 5, burst-capacity: 300 }
              - { bucket: interview-careers-start-ip, key: CLIENT_IP, paths: ["/public/v1/orgs/{slug}/jobs/{jobId}/applications:start"], methods: [POST], replenish-rate: 1, burst-capacity: 3600, requested-tokens: 180 }
          # The public API for customers' servers (ADR-0026): Authorization: Bearer iak_live_... API keys. Anonymous
          # here, because the service checks each key itself (hash, organization, expiry, the creator still a member,
          # per-key rate limit and request log) and only lets it reach @PublicApi operations whose scopes it holds,
          # the same permissions as the rules above. A request without a valid key is refused by the service (401).
          # Every other operation has no rule here and is refused.
          - id: interview-api-keys
            upstream: lb://interview-api
            paths: ["/api/v1/**"]
            access: PROTECTED
            default-rule: DENY
            max-body-bytes: 11534336
            response-timeout-ms: 120000
            # Was the service's own (ApiKeyAuthenticationFilter): 600 a minute per key, the default every key gets. A key
            # created with a limit of its own (iam.api_key.rate_limit_per_minute) is held to it by the service.
            rate-limit: { key: API_KEY, headers: [Authorization], replenish-rate: 10, burst-capacity: 600 }
            rules:
              - paths: ["/api/v1/applications"]
                methods: [GET, POST]
                anonymous: true
              - paths: ["/api/v1/applications/{id}/decisions"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/applications/{id}:move"]
                methods: [POST]
                anonymous: true
              - paths: ["/api/v1/applications/{id}"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/candidates"]
                methods: [GET, POST]
                anonymous: true
              - paths: ["/api/v1/candidates/{id}"]
                methods: [GET, PATCH]
                anonymous: true
              - paths: ["/api/v1/interviews"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/interviews/{id}/assessment"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/interviews/{id}"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/jobs"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/jobs/{id}"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/pipeline-stages"]
                methods: [GET]
                anonymous: true
