# Runvance Meet (repo ai-demo-agent, meet/; pv-auth-service product key "meet"): its public hosts and RBAC rules.
# pg-api-gateway signs people in with pv-auth-service, applies these rules and passes the identity as X-PV-* headers;
# meet-api (Consul: meet-api) has no sign-in or role checks of its own. Catalog: config/pv-auth-service/conf.d/meet.yml.
#
# Two gateway entries, because every route of an entry applies to all of its hosts:
#   meet      the web app (meet-web) and the API people use, behind sign-in. A person new to Meet is PENDING until a
#             Meet super admin approves them; meet-api answers their meeting calls 403 PENDING_APPROVAL until then
#             (a business rule of the product, so /api/v1/me is open to every signed-in person).
#   meet-api  the API host for client platforms (LeadOS live demos, HR and interview tools): their own Meet API keys
#             (Authorization: Bearer mk_...), which meet-api checks itself. Anonymous here, on the meeting endpoints
#             only; pv-auth-service tokens are not accepted there. A separate host because people use the same paths
#             with their session, and a PROTECTED path would reject an mk_ key as an invalid token.
# Invite links (/j/<token> in the web app) are anonymous: the HMAC-signed token in the path is the credential.
pv:
  gateway:
    products:
      meet:
        name: Runvance Meet
        hosts: [meetings.runvance.com, meet.localhost]
        browser-sign-in: true
        routes:
          - id: meet-people-api
            upstream: lb://meet-api
            paths: ["/api/v1/**"]
            access: PROTECTED
            default-rule: DENY
            rules:
              # Invite links: no account needed, meet-api checks the signed token (was permitAll /api/v1/public/**).
              - paths: ["/api/v1/public/invites/{token}"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/public/invites/{token}/join"]
                methods: [POST]
                anonymous: true
              # In a call (guests included): authorized by Meet's own call token from the join (ai-meetings-api.md).
              - paths: ["/api/v1/public/calls/{callToken}/state"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/public/calls/{callToken}/consent", "/api/v1/public/calls/{callToken}/decline",
                        "/api/v1/public/calls/{callToken}/recording/start", "/api/v1/public/calls/{callToken}/recording/stop",
                        "/api/v1/public/calls/{callToken}/end"]
                methods: [POST]
                anonymous: true
              # Phase 1 (ai-demo-agent meet/docs/product/phase1-calendar-and-controls.md). In the call: the waiting room,
              # lock and host controls, authorized by the call token (moderators only, checked by meet-api).
              - paths: ["/api/v1/public/calls/{callToken}/lobby"]
                methods: [GET]
                anonymous: true
              - paths: ["/api/v1/public/calls/{callToken}/lobby/admit-all", "/api/v1/public/calls/{callToken}/lobby/{id}/admit",
                        "/api/v1/public/calls/{callToken}/lobby/{id}/deny", "/api/v1/public/calls/{callToken}/settings",
                        "/api/v1/public/calls/{callToken}/mute-all", "/api/v1/public/calls/{callToken}/participants/{identity}/mute",
                        "/api/v1/public/calls/{callToken}/participants/{identity}/remove",
                        "/api/v1/public/calls/{callToken}/participants/{identity}/role"]
                methods: [POST]
                anonymous: true
              # Phase 3 (meet/docs/product/phase3-live-ai.md): live captions (an Azure Speech token for the person's own
              # browser, their finished sentences) and the in-call assistant, with the call token.
              - paths: ["/api/v1/public/calls/{callToken}/captions/token", "/api/v1/public/calls/{callToken}/captions",
                        "/api/v1/public/calls/{callToken}/assistant"]
                methods: [POST]
                anonymous: true
              # A guest in the waiting room: the ticket the join gave them is the permission.
              - paths: ["/api/v1/public/lobby/{ticket}"]
                methods: [GET, DELETE]
                anonymous: true
              # A person's calendar feed, which calendar apps fetch: its signed URL is the permission.
              - paths: ["/api/v1/public/calendar-feeds/{token}"]
                methods: [GET]
                anonymous: true
              # Phase 2 (meet/docs/product/phase2-calendar-sync.md): Google or Microsoft sends the browser back here; the
              # signed state names the person, PKCE protects the code.
              - paths: ["/api/v1/public/calendar-oauth/{provider}/callback"]
                methods: [GET]
                anonymous: true
              # A host's shared notes and recording link.
              - paths: ["/api/v1/public/shares/{token}"]
                methods: [GET]
                anonymous: true
              # Meet's LiveKit server (deploy/livekit): meet-api checks LiveKit's signature (Authorization) on the body.
              - paths: ["/api/v1/livekit/webhook"]
                methods: [POST]
                anonymous: true
              # Who am I, and where my request to join stands: every signed-in person, PENDING ones included.
              - paths: ["/api/v1/me"]
                methods: [GET]
              - paths: ["/api/v1/me/request"]
                methods: [PUT]
              # A person's own meetings (was hasRole USER; meet-api also requires the person to be approved).
              - paths: ["/api/v1/meetings"]
                methods: [GET, POST]
                permissions: [meeting.manage]
              - paths: ["/api/v1/meetings/{id}"]
                methods: [GET, PATCH]
                permissions: [meeting.manage]
              - paths: ["/api/v1/meetings/{id}/invites"]
                methods: [GET, POST]
                permissions: [meeting.manage]
              - paths: ["/api/v1/meetings/{id}/invites/{inviteId}"]
                methods: [DELETE]
                permissions: [meeting.manage]
              - paths: ["/api/v1/meetings/{id}/end", "/api/v1/meetings/{id}/cancel", "/api/v1/meetings/{id}/join",
                        "/api/v1/meetings/{id}/shared-link/reset", "/api/v1/meetings/{id}/occurrences/cancel",
                        "/api/v1/me/calendar-feed/reset"]
                methods: [POST]
                permissions: [meeting.manage]
              - paths: ["/api/v1/calendar", "/api/v1/meetings/{id}/calendar.ics", "/api/v1/me/personal-room", "/api/v1/me/calendar-feed"]
                methods: [GET]
                permissions: [meeting.manage]
              # Phase 4 (meet/docs/product/phase4-workspaces-and-crm.md): the caller's workspace; meet-api lets only its
              # admins change the settings.
              - paths: ["/api/v1/workspace", "/api/v1/workspace/meetings"]
                methods: [GET]
                permissions: [meeting.manage]
              - paths: ["/api/v1/workspace/settings"]
                methods: [PATCH]
                permissions: [meeting.manage]
              # A person's connected Google and Microsoft calendars.
              - paths: ["/api/v1/calendar-connections"]
                methods: [GET]
                permissions: [meeting.manage]
              - paths: ["/api/v1/calendar-connections/{provider}/start"]
                methods: [POST]
                permissions: [meeting.manage]
              - paths: ["/api/v1/calendar-connections/{id}"]
                methods: [PATCH, DELETE]
                permissions: [meeting.manage]
              # After the call: sessions, recordings, transcripts, AI notes, shares, search (the owner's meetings).
              - paths: ["/api/v1/meetings/{id}/sessions", "/api/v1/meetings/{id}/sessions/{sessionId}",
                        "/api/v1/meetings/{id}/recordings/{recordingId}/transcript",
                        "/api/v1/meetings/{id}/recordings/{recordingId}/transcript.txt",
                        "/api/v1/meetings/{id}/recordings/{recordingId}/transcript.vtt",
                        "/api/v1/meetings/{id}/recordings/{recordingId}/transcript.srt",
                        "/api/v1/meetings/{id}/recordings/{recordingId}/notes",
                        "/api/v1/meetings/{id}/recordings/{recordingId}/media",
                        "/api/v1/meetings/{id}/recordings/{recordingId}/shares", "/api/v1/search"]
                methods: [GET]
                permissions: [meeting.manage]
              - paths: ["/api/v1/meetings/{id}/recordings/{recordingId}/notes/regenerate",
                        "/api/v1/meetings/{id}/recordings/{recordingId}/shares"]
                methods: [POST]
                permissions: [meeting.manage]
              - paths: ["/api/v1/meetings/{id}/recordings/{recordingId}/action-items/{itemId}"]
                methods: [PATCH]
                permissions: [meeting.manage]
              - paths: ["/api/v1/meetings/{id}/recordings/{recordingId}",
                        "/api/v1/meetings/{id}/recordings/{recordingId}/shares/{shareId}"]
                methods: [DELETE]
                permissions: [meeting.manage]
              # The super admin console: approvals, platforms and their keys, oversight (was the env-configured
              # superadmin, hasRole SUPERADMIN on /api/v1/superadmin/**). Platform organization only.
              - paths: ["/api/v1/superadmin/overview", "/api/v1/superadmin/requests", "/api/v1/superadmin/users",
                        "/api/v1/superadmin/apps", "/api/v1/superadmin/meetings", "/api/v1/superadmin/audit"]
                methods: [GET]
                roles: [super_admin]
                orgs: [platform]
              - paths: ["/api/v1/superadmin/users/{id}/approve", "/api/v1/superadmin/users/{id}/reject",
                        "/api/v1/superadmin/users/{id}/suspend", "/api/v1/superadmin/users/{id}/reactivate",
                        "/api/v1/superadmin/apps", "/api/v1/superadmin/apps/{id}/rotate-key",
                        "/api/v1/superadmin/apps/{id}/disable", "/api/v1/superadmin/apps/{id}/enable"]
                methods: [POST]
                roles: [super_admin]
                orgs: [platform]
            # Invite links, per client address: 60 at once, then one a second (the gateway's own ceiling).
            # Public pages per client address. Not the waiting room's poll (every 2.5 s per guest, and a room of guests
            # can share an office's address): that has its own buckets below.
            rate-limit: { key: CLIENT_IP, replenish-rate: 1, burst-capacity: 60, paths: ["/api/v1/public/invites/**", "/api/v1/public/calls/**",
                                                                                     "/api/v1/public/shares/**", "/api/v1/public/calendar-feeds/**",
                                                                                     "/api/v1/public/calendar-oauth/**"] }
            # The only limits on these requests (meet-api's own RateLimiter was removed on 2026-11-09): joining by invite
            # link 60 per 10 minutes per client address; invitations 100 an hour per person; the waiting room's poll one a
            # second per guest and 20 a second per client address.
            rate-limits:
              - { key: GUEST, path-variable: ticket, paths: ["/api/v1/public/lobby/{ticket}"], replenish-rate: 1, burst-capacity: 30 }
              # Captions: a sentence every few seconds per speaker (their own bucket, not the public pages' per address); the
              # assistant: a model call, so a few a minute per person.
              - { key: GUEST, path-variable: callToken, paths: ["/api/v1/public/calls/{callToken}/captions"], methods: [POST], replenish-rate: 2, burst-capacity: 60 }
              - { key: GUEST, path-variable: callToken, paths: ["/api/v1/public/calls/{callToken}/assistant"], methods: [POST], replenish-rate: 1, burst-capacity: 60, requested-tokens: 10 }
              - { key: CLIENT_IP, paths: ["/api/v1/public/lobby/{ticket}"], replenish-rate: 20, burst-capacity: 600 }
              - { key: CLIENT_IP, paths: ["/api/v1/public/invites/{token}/join"], methods: [POST], replenish-rate: 1, burst-capacity: 600, requested-tokens: 10 }
              - { key: USER, paths: ["/api/v1/meetings/{id}/invites"], methods: [POST], replenish-rate: 1, burst-capacity: 3600, requested-tokens: 36 }
              # LiveKit sends a burst of events per meeting (joins, tracks, recordings): generous, from its one address.
              - { key: CLIENT_IP, paths: ["/api/v1/livekit/webhook"], methods: [POST], replenish-rate: 50, burst-capacity: 2000 }
              # Notes regenerate through ai-service: a few per hour per person.
              - { key: USER, paths: ["/api/v1/meetings/{id}/recordings/{recordingId}/notes/regenerate"], methods: [POST], replenish-rate: 1, burst-capacity: 3600, requested-tokens: 600 }
          - id: meet-web
            access: PUBLIC
            upstream: ${MEET_WEB_URI:lb://meet-web}

      meet-api:
        name: Runvance Meet API
        hosts: [meet-api.runvance.com, meet-api.localhost]
        browser-sign-in: false
        routes:
          - id: meet-platform-api
            upstream: lb://meet-api
            paths: ["/api/v1/meetings", "/api/v1/meetings/**", "/api/v1/apps/me/webhook", "/api/v1/apps/me/webhook/**"]
            access: PROTECTED
            default-rule: DENY
            # Every endpoint is anonymous here: callers are client platforms' servers with their mk_ key, which
            # meet-api checks itself (key, platform enabled, its own meetings only). No valid key: 401 from meet-api.
            # The only limit on invitations from platforms (meet-api's own RateLimiter was removed on 2026-11-09): 600 an
            # hour per client platform (its one mk_ key).
            rate-limit: { key: API_KEY, headers: [Authorization], paths: ["/api/v1/meetings/{id}/invites"], methods: [POST], replenish-rate: 1, burst-capacity: 3600, requested-tokens: 6 }
            rules:
              # A platform's webhook for its meetings' events (phase 4), with its own key.
              - paths: ["/api/v1/apps/me/webhook"]
                methods: [GET, PUT, DELETE]
                anonymous: true
              - paths: ["/api/v1/apps/me/webhook/rotate-secret"]
                methods: [POST]
                anonymous: true
              - paths: ["/api/v1/meetings"]
                methods: [GET, POST]
                anonymous: true
              - paths: ["/api/v1/meetings/{id}"]
                methods: [GET, PATCH]
                anonymous: true
              - paths: ["/api/v1/meetings/{id}/invites"]
                methods: [GET, POST]
                anonymous: true
              - paths: ["/api/v1/meetings/{id}/invites/{inviteId}"]
                methods: [DELETE]
                anonymous: true
              - paths: ["/api/v1/meetings/{id}/end", "/api/v1/meetings/{id}/cancel", "/api/v1/meetings/{id}/join",
                        "/api/v1/meetings/{id}/shared-link/reset"]
                methods: [POST]
                anonymous: true
