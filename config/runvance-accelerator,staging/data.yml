# Runvance Accelerator in staging (SPRING_PROFILES_ACTIVE=staging): only what differs from
# config/runvance-accelerator.
runvance:
  notify:
    # The platform organization's id in this environment's pv-auth-service (alias "platform"): the
    # demo-request alert is the platform's own message, metered there. Each environment's pv-auth-service
